<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scriber Widget</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <div class="widget" id="widget">
    <!-- Status Indicator -->
    <div class="status-indicator" id="statusIndicator">
      <div class="status-dot" id="statusDot"></div>
    </div>

    <!-- Active App / Mode Badge -->
    <div class="app-badge" id="appBadge" title="Target App Context">
      <span class="app-icon" id="appIcon">✨</span>
      <span class="app-name" id="appName">Ready</span>
    </div>

    <!-- Status Text -->
    <span class="status-text" id="statusText">Listening…</span>

    <!-- Timer -->
    <span class="timer" id="timer">0:00</span>

    <!-- Audio Level Meter (7 bars) -->
    <div class="audio-meter" id="audioMeter">
      <div class="audio-bar" id="bar0"></div>
      <div class="audio-bar" id="bar1"></div>
      <div class="audio-bar" id="bar2"></div>
      <div class="audio-bar" id="bar3"></div>
      <div class="audio-bar" id="bar4"></div>
      <div class="audio-bar" id="bar5"></div>
      <div class="audio-bar" id="bar6"></div>
    </div>

    <!-- Done Metrics Flash -->
    <div class="speed-badge" id="speedBadge">
      <span id="speedText">⚡ 0.6s</span>
    </div>
  </div>

  <script src="widget.js"></script>
</body>
</html>
